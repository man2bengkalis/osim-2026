<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSIM MAN 2 Bengkalis 2026 - Official</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',sans-serif}
body{background:#f8fafc}
.header{background:linear-gradient(135deg,#14532d,#166534);color:white;padding:14px 16px;position:sticky;top:0;z-index:100}
.logo{width:45px;height:45px;background:white;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#14532d;font-weight:bold}
.trust-bar{background:#dcfce7;color:#14532d;padding:8px 12px;border-radius:10px;font-size:11px;display:flex;gap:8px;margin-top:10px}
.page{display:none;max-width:520px;margin:0 auto;padding:16px}
.page.active{display:block}
/* --- YANG LAIN TETAP SAMA --- */
.btn-browser{
  background:#1e40af;
  color:white;
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  font-weight:600;
  display:block;
  text-align:center;
  text-decoration:none;
}
</style>
</head>
<body>

<!-- KODE KAMU YANG LAIN TETAP SAMA, CUMA BAGIAN INI YANG AKU BENERIN -->

<div style="margin-top:20px">
  <p style="text-align:center;font-size:13px;margin-bottom:8px">Link Wawancara Resmi</p>
  <p style="text-align:center;font-size:12px;color:#2563eb;margin-bottom:10px;word-break:break-all;">https://meet.google.com/cgm-tenn-wvz</p>
  
  <!-- INI YANG SUDAH DI FIX - BIAR LANGSUNG KE BROWSER BUKAN PLAYSTORE -->
  <a href="https://meet.google.com/cgm-tenn-wvz?pli=1" target="_blank" rel="noopener noreferrer" class="btn-browser">
    GABUNG VIA BROWSER →
  </a>
</div>

<script>
// FIX: biar kalau di klik di dalam WebView / HP gak mental ke Play Store
document.querySelectorAll('.btn-browser').forEach(btn=>{
  btn.addEventListener('click', function(e){
    e.preventDefault();
    window.open(this.href, '_blank');
  });
});
</script>

</body>
  </html>
