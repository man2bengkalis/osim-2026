<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSIM MAN 2 Bengkalis 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#f0fdf4}
.header{background:#14532d;color:white;padding:16px;display:flex;justify-content:space-between;align-items:center}
.page{display:none;max-width:480px;margin:20px auto;padding:16px}
.page.active{display:block}
.card{background:white;padding:24px;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
input,select{width:100%;padding:14px;margin:8px 0;border:1.5px solid #ddd;border-radius:12px;font-size:15px;background:white}
.btn-green{width:100%;background:#14532d;color:white;padding:14px;border-radius:12px;font-size:16px;margin-top:10px;border:none;font-weight:bold;cursor:pointer}
.btn{padding:8px 16px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.lulus{background:#dcfce7;color:#166534}.tidak{background:#fee2e2;color:#991b1b}.menunggu{background:#fef9c3;color:#854d0e}
.stat{flex:1;background:white;padding:12px;border-radius:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee;align-items:center}
.popup-bg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:999;justify-content:center;align-items:center}
.popup-bg.show{display:flex}
.popup{background:white;padding:30px;border-radius:20px;text-align:center;max-width:360px;width:90%}
</style>
</head>
<body>
<div class="header"><b>MAN 2 BENGKALIS 2026</b><button class="btn" style="background:white;color:#14532d" onclick="showPage('login')">ADMIN</button></div>
<div id="page-home" class="page active"><div class="card" style="text-align:center"><h1 style="color:#14532d">Pendaftaran OSIM 2026</h1><p style="color:gray">Wawancara via Browser - Tanpa Download</p><button class="btn-green" onclick="showPage('daftar')">DAFTAR SEKARANG →</button><button class="btn" style="width:100%;margin-top:10px;background:#f0fdf4;color:#14532d" onclick="showPage('status')">CEK STATUS</button></div></div>
<div id="page-daftar" class="page"><div class="card"><h2>Form Pendaftaran</h2><input id="nama" placeholder="Nama Lengkap"><input id="kelas" placeholder="Kelas"><select id="mencalon"><option value="" disabled selected>Mencalon Sebagai...</option><option value="BID.PENDIDIKAN & BELANEGARA">BID.PENDIDIKAN & BELANEGARA</option><option value="BID.KEAGAMAAN & KEDISIPLINAN">BID.KEAGAMAAN & KEDISIPLINAN</option><option value="BID.OLAHRAGA & SENI MINAT BAKAT">BID.OLAHRAGA & SENI MINAT BAKAT</option><option value="BID.PERLENGKAPAN & KEBERSIHAN">BID.PERLENGKAPAN & KEBERSIHAN</option><option value="BID.HUMAS & DOKUMENTASI">BID.HUMAS & DOKUMENTASI</option></select><input id="wa" placeholder="No WA"><button class="btn-green" onclick="daftar()">DAFTAR</button><button class="btn" style="width:100%;margin-top:8px" onclick="showPage('home')">← Kembali</button></div></div>
<div id="page-status" class="page"><div class="card"><h2>Cek Kelulusan</h2><div id="listStatus"></div></div></div>
<div id="page-login" class="page"><div class="card"><h2>🔐 Login Admin</h2><input id="adminUser" placeholder="Username"><input id="adminPass" type="password" placeholder="Password"><button class="btn-green" onclick="doLogin()">MASUK</button></div></div>
<div id="page-admin" class="page" style="max-width:700px"><div class="card"><h2>Dashboard Admin</h2><div style="display:flex;gap:10px;margin:15px 0"><div class="stat"><div id="total">0</div><small>Total</small></div><div class="stat"><div id="jLulus">0</div><small>Lulus</small></div><div class="stat"><div id="jTidak">0</div><small>Tidak</small></div></div><input id="meetLink" placeholder="Link Meet"><button class="btn" style="background:#2563eb;color:white;width:100%" onclick="saveMeet()">Simpan Link</button><button class="btn" style="background:#22c55e;color:white;width:100%;margin-top:8px" onclick="downloadExcel()">📥 Download Excel</button><div id="adminList"></div></div></div>
<div id="popupSukses" class="popup-bg"><div class="popup"><div style="font-size:50px">✅</div><h2 id="popupNama"></h2><div style="background:#fef9c3;padding:10px;border-radius:12px;border:1.5px dashed #eab308;text-align:left;margin:12px 0"><b style="font-size:13px">⚠️ GAK PERLU DOWNLOAD APLIKASI!</b><br><small>1. Klik JOIN VIA BROWSER<br>2. Pilih "Lanjutkan di browser"<br>3. Hemat paket!</small></div><a id="meetLinkPopup" href="" target="_blank"></a><br><button class="btn" style="background:#2563eb;color:white;width:100%;margin-top:8px" onclick="window.open(meet,'_blank')">JOIN VIA BROWSER (Tanpa Download) →</button><button class="btn-green" onclick="tutupPopup()">CEK STATUS →</button></div></div>
<div id="popupBlock" class="popup-bg"><div class="popup"><h2>Sudah Terdaftar!</h2><p id="popupBlockNama"></p></div></div>
<script>
let defaultMeet='https://meet.google.com/vpm-tenm-qwz';let data=JSON.parse(localStorage.getItem('osim_2026')||'[]');let meet=localStorage.getItem('meet_2026')||defaultMeet;
function showPage(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.getElementById('page-'+p).classList.add('active');if(p=='status'||p=='admin')render();}
function doLogin(){if(adminUser.value.toLowerCase()=='admin'&&adminPass.value.toLowerCase()=='man2bengkalis')showPage('admin');}
function daftar(){let n=nama.value.trim(),k=kelas.value.trim(),m=mencalon.value;if(!n||!k||!m)return alert('Lengkapi!');let ts=new Date().toLocaleString('id-ID');data.push({timestamp:ts,nama:n,kelas:k,mencalon:m,wa:wa.value,status:'MENUNGGU'});localStorage.setItem('osim_2026',JSON.stringify(data));localStorage.setItem('osim_sudah_daftar_2026',n);popupNama.innerText='Selamat '+n+' - '+m;meetLinkPopup.href=meet;meetLinkPopup.innerText=meet;document.getElementById('popupSukses').classList.add('show');}
function tutupPopup(){document.getElementById('popupSukses').classList.remove('show');showPage('status');}
function render(){total.innerText=data.length;let h='';data.forEach((d,i)=>{h+=`<div class="row"><div><b>${d.nama}</b><br><small>${d.kelas} • ${d.mencalon}</small></div></div>`});adminList.innerHTML=h;let h2='';data.forEach(d=>{h2+=`<div>${d.nama} - ${d.mencalon}</div>`});h2+=`<div style="margin-top:15px;background:#fef9c3;padding:12px;border-radius:12px;text-align:left"><b>⚠️ TANPA DOWNLOAD:</b><br><small>Klik GABUNG > Pilih "Lanjutkan di browser"</small></div><div style="background:#eff6ff;padding:12px;margin-top:10px;text-align:center"><a href="${meet}" target="_blank">${meet}</a><br><button class="btn" style="background:#2563eb;color:white;width:100%;margin-top:8px" onclick="window.open('${meet}','_blank')">GABUNG VIA BROWSER →</button></div>`;listStatus.innerHTML=h2;}
function saveMeet(){meet=meetLink.value||defaultMeet;localStorage.setItem('meet_2026',meet);render();}
function downloadExcel(){let csv="TIMESTAMP,NAMA,KELAS,MENCALON,WA,STATUS\n";data.forEach(d=>{csv+=`"${d.timestamp}","${d.nama}","${d.kelas}","${d.mencalon}","${d.wa}","${d.status}"\n`});let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='OSIM_MAN2_2026.csv';a.click();}
render();
</script>
</body>
</html>
